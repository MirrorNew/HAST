project: HAST-Lite-Full
llm:
  model: GPT-5.5
  reasoning_effort: none
  temperature: 0.2
budgets:
  stage1_candidates: 300
  stage2_llm_calls: 10
  stage3_candidates: 200
datasets:
  real:
    - CEnew
    - Collaboration
    - condmat
    - crime
    - email
    - Grid
    - GrQC
    - hamster
    - HepPh
    - PH
    - Yeast
  synthetic:
    - Powerlaw_500
rates:
  default: 0.30
  email: 0.40
seeds:
  scaling:
    - 42
    - 43
    - 44
stage1:
  name: cost-aware free search
  root: HDA-original
  credit: GCC/R + HDA-relative FAC + FAC-T time penalty
stage2:
  name: log-induced bound induction
  output: bound policy JSON only
stage3:
  name: bounded guided search
  seed_source: best Stage-1 family or top Stage-1 candidates
final_selection:
  validation: full 12-graph validation
  selector: Pareto frontier
  labels:
    - HAST-Final-Q
    - HAST-Final-S
